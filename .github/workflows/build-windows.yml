name: build-windows

# CI keeps the PyInstaller bundle (scripts/swiftmedics-pyinstaller.spec) as a
# reproducible smoke artifact: PyInstaller cannot cross-compile, so the job
# must run on Windows. The HOSPITAL DEMO release path is different and stays
# local: scripts/build_hospital_demo.ps1 (Nuitka + token broker + compiled-in
# demo expiry). Locally, the same PyInstaller build is one command on Windows:
#     .\scripts\build_windows.ps1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 has binary wheels for every pinned dependency
          # (pyahocorasick==2.3.1, PyAudio, speechmatics-rt), so the build
          # needs no C toolchain on the runner.
          python-version: "3.12"
          cache: pip

      - name: Install runtime and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Test
        run: python -m pytest -q

      - name: Verify the derived Speechmatics vocabulary artifact
        run: python scripts/export_additional_vocab.py --check

      - name: Verify the Vercel function config matches its location
        shell: pwsh
        run: |
          # The token broker is deployed as a file-based /api function; its
          # vercel.json config must live at the project root.
          if (-not (Test-Path api/token.py)) { throw "api/token.py is missing." }
          if (-not (Test-Path vercel.json)) { throw "vercel.json must be at the project root." }
          python -c "import pathlib; src=pathlib.Path('api/token.py').read_text(encoding='utf-8'); assert 'def application(' in src, 'WSGI application entry point missing'; assert 'def handler(' not in src, 'legacy Lambda-style handler must not return'"

      - name: Build the one-folder bundle (developer fallback path)
        run: python -m PyInstaller --clean --noconfirm scripts/swiftmedics-pyinstaller.spec

      - name: Verify the executable exists
        run: |
          if (-not (Test-Path dist\SwiftMedics\SwiftMedics.exe)) {
            throw "Build finished but dist\SwiftMedics\SwiftMedics.exe is missing."
          }

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: SwiftMedics-windows
          path: dist/SwiftMedics
          if-no-files-found: error
          retention-days: 30
